{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Documentos</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Documentos</h1>
    <table>
        <tr>
            <th>Nombre de archivo</th>
            <th>Descargar</th>
        </tr>
        {% for filename in files %}
        <tr>
            <td>{{ filename }}</td>
            <td><a href="{% url 'download_file' filename %}" download>Descargar</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
